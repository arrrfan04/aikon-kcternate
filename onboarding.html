<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIKON - Onboarding Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .onboarding-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
        
        .onboarding-sidebar { background: white; border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); position: sticky; top: 0px; }
        .progress-circle-container { position: relative; width: 120px; height: 120px; margin: 0 auto 24px; }
        .progress-circle-bg { fill: none; stroke: #F1F5F9; stroke-width: 8; }
        .progress-circle-fill { fill: none; stroke: var(--success-green); stroke-width: 8; stroke-dasharray: 440; stroke-dashoffset: 154; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .progress-text h3 { font-size: 24px; font-weight: 800; }
        .progress-text p { font-size: 10px; color: var(--text-muted); }

        .module-list { display: flex; flex-direction: column; gap: 6px; }
        .module-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text-muted); transition: 0.2s; }
        .module-item.completed { color: var(--success-green); }
        .module-item.active { background: var(--light-blue); color: var(--primary-blue); }
        .module-item i { width: 18px; }

        .onboarding-content { background: white; border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-sm); min-height: 70vh; }

        .step-section h2 { font-size: 20px; margin-bottom: 12px; }
        .step-description { color: var(--text-muted); margin-bottom: 32px; }

        .process-flow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; position: relative; padding: 0 20px; }
        .process-flow::before { content: ''; position: absolute; top: 30px; left: 80px; right: 80px; height: 2px; background: #E2E8F0; z-index: 0; }
        .flow-step { position: relative; z-index: 1; text-align: center; width: 100px; }
        .flow-icon { width: 60px; height: 60px; border-radius: 50%; background: white; border: 2px solid var(--success-green); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--success-green); box-shadow: var(--shadow-md); transition: 0.3s; }
        .flow-step:hover .flow-icon { transform: scale(1.1); }
        .flow-step span { font-size: 12px; font-weight: 600; color: var(--text-main); display: block; line-height: 1.4; }

        .summary-box { background: #F8FAFC; border-radius: var(--radius-md); padding: 24px; margin-bottom: 32px; }
        .summary-box h3 { font-size: 16px; margin-bottom: 12px; }
        .summary-box p { font-size: 14px; color: var(--text-muted); line-height: 1.8; }

        .action-btns { display: flex; gap: 16px; }
        .btn-primary { background: var(--primary-blue); color: white; padding: 12px 32px; border-radius: var(--radius-sm); font-weight: 600; transition: 0.2s; }
        .btn-primary:hover { background: #0037a0; box-shadow: var(--shadow-md); }
    </style>
</head>
<body class="dashboard-page">
    <div class="mobile-header">
        <button class="menu-toggle-btn" id="menuToggle"><i data-lucide="menu"></i></button>
        <div class="mobile-logo">AI<span>KON</span></div>
        <div class="profile-img" style="width:30px; height:30px;"></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
        <div class="logo">
            <i data-lucide="bot" style="color:var(--secondary-cyan)"></i>
            <span>AIKON</span>
        </div>
        <nav style="flex: 1">
            <a href="home.html" class="nav-item">
                <i data-lucide="home"></i>
                <span>Beranda</span>
            </a>
            <a href="knowledge-base.html" class="nav-item">
                <i data-lucide="book"></i>
                <span>Knowledge Base</span>
            </a>
            <a href="onboarding.html" class="nav-item active">
                <i data-lucide="users"></i>
                <span>Onboarding</span>
            </a>
            <a href="update.html" class="nav-item">
                <i data-lucide="bell"></i>
                <span>Update</span>
            </a>
            <a href="dashboard.html" class="nav-item">
                <i data-lucide="layout"></i>
                <span>Dashboard</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="bantuan.html" class="nav-item">
                <i data-lucide="help-circle"></i>
                <span>Bantuan</span>
            </a>
            <a href="index.html" class="nav-item">
                <i data-lucide="log-out"></i>
                <span>Keluar</span>
            </a>
        </div>
    </aside>

    <main class="main-content fade-in">
        <header class="content-header">
            <h1>Onboarding Guide</h1>
            <p>Panduan langkah demi langkah untuk membantu Anda memahami alur kerja.</p>
        </header>

        <div class="onboarding-layout">
            <aside class="onboarding-sidebar">
                <div class="progress-circle-container">
                    <svg viewBox="0 0 160 160" width="120" height="120">
                        <circle class="progress-circle-bg" cx="80" cy="80" r="70" />
                        <circle class="progress-circle-fill" cx="80" cy="80" r="70" />
                    </svg>
                    <div class="progress-text">
                        <h3>0%</h3>
                        <p>0 dari 6 modul selesai</p>
                    </div>
                </div>

                <div class="module-list">
                    <!-- Populated dynamically -->
                </div>
            </aside>

            <section class="onboarding-content">
                <!-- Populated dynamically -->
            </section>
        </div>
    </main>
    <script>
        lucide.createIcons();

        const modules = [
            {
                id: 1,
                title: "1. Selamat Datang",
                content: `
                    <h2>1. Selamat Datang di AIKON</h2>
                    <p class="step-description">Selamat bergabung di BPJS Kesehatan Kantor Cabang Ternate! AIKON (Asisten Konten Pengetahuan) dirancang untuk membantu Anda memahami tugas, SOP, regulasi, dan materi pembelajaran lainnya dengan mudah.</p>
                    <div class="summary-box">
                        <h3>Orientasi Awal</h3>
                        <p>Sebagai staf baru, Anda diharapkan dapat menyesuaikan diri dengan cepat. Silakan pelajari setiap modul panduan onboarding ini dan tandai selesai jika Anda telah memahaminya. Progres Anda akan langsung tercatat pada dashboard profil Anda.</p>
                    </div>
                `
            },
            {
                id: 2,
                title: "2. Mengenal BPJS Kesehatan",
                content: `
                    <h2>2. Mengenal BPJS Kesehatan</h2>
                    <p class="step-description">Mengenal struktur organisasi, tata nilai, serta visi dan misi BPJS Kesehatan.</p>
                    <div class="summary-box" style="margin-bottom: 20px;">
                        <h3>Visi & Misi</h3>
                        <p><strong>Visi:</strong> Menjadi badan penyelenggara jaminan sosial kesehatan yang berkualitas, berkeadilan, dan berkelanjutan.</p>
                        <p style="margin-top: 10px;"><strong>Misi:</strong> Memberikan pelayanan prima kepada peserta, memperluas cakupan kepesertaan, serta menjaga kesinambungan keuangan program JKN.</p>
                    </div>
                    <div class="summary-box">
                        <h3>Tata Nilai Organisasi</h3>
                        <p>BPJS Kesehatan memiliki tata nilai utama yang disingkat <strong>PROFIT</strong>: Profesional, Respek, Orientasi Pelanggan, Integritas, Kepercayaan, dan Kerja Sama Tim.</p>
                    </div>
                `
            },
            {
                id: 3,
                title: "3. Sistem & Aplikasi",
                content: `
                    <h2>3. Sistem & Aplikasi Utama</h2>
                    <p class="step-description">Daftar sistem informasi internal yang akan Anda gunakan sehari-hari.</p>
                    <div class="process-flow" style="display:flex; justify-content:space-around; gap:16px; margin-bottom:32px;">
                        <div class="flow-step" style="text-align:center;">
                            <div class="flow-icon" style="width:60px; height:60px; border-radius:50%; background:white; border:2px solid var(--primary-blue); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:var(--primary-blue);"><i data-lucide="smartphone"></i></div>
                            <span>Mobile JKN</span>
                        </div>
                        <div class="flow-step" style="text-align:center;">
                            <div class="flow-icon" style="width:60px; height:60px; border-radius:50%; background:white; border:2px solid var(--primary-blue); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:var(--primary-blue);"><i data-lucide="database"></i></div>
                            <span>VClaim & PCare</span>
                        </div>
                        <div class="flow-step" style="text-align:center;">
                            <div class="flow-icon" style="width:60px; height:60px; border-radius:50%; background:white; border:2px solid var(--primary-blue); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:var(--primary-blue);"><i data-lucide="users"></i></div>
                            <span>Edabu & SIPP</span>
                        </div>
                    </div>
                    <div class="summary-box">
                        <h3>Keterangan</h3>
                        <p>Aplikasi VClaim digunakan untuk verifikasi klaim rumah sakit, PCare untuk faskes primer, sedangkan Edabu digunakan oleh badan usaha terdaftar untuk mengelola kepesertaan karyawannya.</p>
                    </div>
                `
            },
            {
                id: 4,
                title: "4. Alur Kerja Utama",
                content: `
                    <h2>4. Alur Kerja Utama</h2>
                    <p class="step-description">Memahami alur kerja pemrosesan data dan pelayanan di Kantor Cabang.</p>
                    <div class="process-flow">
                        <div class="flow-step">
                            <div class="flow-icon"><i data-lucide="file-input"></i></div>
                            <span>Input Permintaan</span>
                        </div>
                        <div class="flow-step">
                            <div class="flow-icon"><i data-lucide="user-check"></i></div>
                            <span>Verifikasi Data</span>
                        </div>
                        <div class="flow-step">
                            <div class="flow-icon"><i data-lucide="laptop"></i></div>
                            <span>Proses di Sistem</span>
                        </div>
                        <div class="flow-step">
                            <div class="flow-icon"><i data-lucide="info"></i></div>
                            <span>Tindak Lanjut</span>
                        </div>
                    </div>
                    <div class="summary-box">
                        <h3>Ringkasan Alur</h3>
                        <p>Alur kerja dimulai dari penerimaan berkas permintaan oleh front office, verifikasi kesesuaian berkas oleh penanggung jawab administrasi, entri data ke sistem aplikasi terkait, hingga penyerahan hasil tindak lanjut informasi kepada peserta.</p>
                    </div>
                `
            },
            {
                id: 5,
                title: "5. Pelayanan Peserta",
                content: `
                    <h2>5. Pelayanan Peserta & Front Office</h2>
                    <p class="step-description">Mempelajari standar pelayanan prima saat berhadapan langsung dengan peserta.</p>
                    <div class="summary-box">
                        <h3>Service Level Agreement (SLA)</h3>
                        <p>1. Waktu tunggu pelayanan di loket maksimal 15 menit.<br>
                        2. Penanganan keluhan peserta langsung selesai di hari yang sama jika berkas lengkap.<br>
                        3. Mengedepankan 3S (Senyum, Sapa, Salam) serta empati tinggi terhadap kendala peserta.</p>
                    </div>
                `
            },
            {
                id: 6,
                title: "6. Evaluasi",
                content: `
                    <h2>6. Kuis Evaluasi Onboarding</h2>
                    <p class="step-description">Kerjakan kuis singkat berikut untuk menguji pemahaman Anda.</p>
                    <div class="summary-box" id="quizContainer">
                        <div style="margin-bottom: 20px;">
                            <p style="font-weight:600; margin-bottom:8px;">1. Manakah tata nilai utama BPJS Kesehatan?</p>
                            <label style="display:block; margin-bottom:4px; font-size:14px;"><input type="radio" name="q1" value="A"> A. Keuntungan Keuangan Tinggi</label>
                            <label style="display:block; font-size:14px;"><input type="radio" name="q1" value="B"> B. PROFIT (Profesional, Respek, Integritas...)</label>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <p style="font-weight:600; margin-bottom:8px;">2. Berapa batas waktu maksimal antrean loket berdasarkan SLA?</p>
                            <label style="display:block; margin-bottom:4px; font-size:14px;"><input type="radio" name="q2" value="A"> A. 30 menit</label>
                            <label style="display:block; font-size:14px;"><input type="radio" name="q2" value="B"> B. 15 menit</label>
                        </div>
                        <button class="btn-primary" onclick="submitQuiz()" style="padding:10px 24px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer;">Kirim Jawaban</button>
                        <div id="quizResult" style="margin-top:16px; font-weight:700; font-size:14px; display:none;"></div>
                    </div>
                `
            }
        ];

        const currentUser = JSON.parse(localStorage.getItem('aikon_current_user')) || { npp: '12345', nama: 'Budi Santoso' };
        const userProgressKey = 'aikon_onboarding_progress_' + currentUser.npp;
        let progress = JSON.parse(localStorage.getItem(userProgressKey)) || { 1: true, 2: true, 3: true, 4: false, 5: false, 6: false };
        let currentModuleId = 4;

        function renderOnboarding() {
            // Render Module List Sidebar
            const moduleList = document.querySelector('.module-list');
            moduleList.innerHTML = modules.map(m => {
                const isCompleted = progress[m.id];
                const isActive = m.id === currentModuleId;
                let icon = isCompleted ? 'check-circle-2' : 'circle';
                let iconOpacity = isCompleted ? '' : (isActive ? '' : 'style="opacity:0.3"');
                return `
                    <div class="module-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}" onclick="selectModule(${m.id})" style="cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; margin-bottom:6px;">
                        <i data-lucide="${icon}" size="18" ${iconOpacity}></i>
                        <span>${m.title}</span>
                    </div>
                `;
            }).join('');

            // Render Active Module Content
            const contentSection = document.querySelector('.onboarding-content');
            const activeMod = modules.find(m => m.id === currentModuleId);
            const isCompleted = progress[currentModuleId];
            
            contentSection.innerHTML = `
                <div class="step-section">
                    ${activeMod.content}
                    <div class="action-btns" style="margin-top:32px; display:flex; gap:16px;">
                        <button class="${isCompleted ? 'btn-modal-cancel' : 'btn-primary'}" onclick="toggleModuleCompletion()" style="padding:12px 28px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer;">
                            ${isCompleted ? 'Batalkan Tandai Selesai' : 'Tandai Selesai ✓'}
                        </button>
                    </div>
                </div>
            `;

            // Update Progress stats
            const total = modules.length;
            const completed = Object.values(progress).filter(Boolean).length;
            const percent = Math.round((completed / total) * 100);

            // Update progress SVG circle
            const circle = document.querySelector('.progress-circle-fill');
            if (circle) {
                const offset = 440 - (440 * percent) / 100;
                circle.style.strokeDashoffset = offset;
            }

            // Update progress text
            document.querySelector('.progress-text h3').innerText = `${percent}%`;
            document.querySelector('.progress-text p').innerText = `${completed} dari ${total} modul selesai`;

            lucide.createIcons();
        }

        window.selectModule = function(id) {
            currentModuleId = id;
            renderOnboarding();
        };

        window.toggleModuleCompletion = function() {
            progress[currentModuleId] = !progress[currentModuleId];
            localStorage.setItem(userProgressKey, JSON.stringify(progress));
            
            // Dispatch a change event to let local DB/dashboards know
            window.dispatchEvent(new Event('aikon_db_changed'));
            renderOnboarding();
        };

        window.submitQuiz = function() {
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            if (!q1 || !q2) {
                alert('Harap jawab semua pertanyaan!');
                return;
            }
            const isCorrect = q1.value === 'B' && q2.value === 'B';
            const resultDiv = document.getElementById('quizResult');
            resultDiv.style.display = 'block';
            if (isCorrect) {
                resultDiv.style.color = 'var(--success-green)';
                resultDiv.innerText = 'Jawaban Anda benar semua! Selamat!';
                progress[6] = true;
                localStorage.setItem(userProgressKey, JSON.stringify(progress));
                window.dispatchEvent(new Event('aikon_db_changed'));
                setTimeout(renderOnboarding, 1500);
            } else {
                resultDiv.style.color = '#DC2626';
                resultDiv.innerText = 'Ada jawaban yang salah. Silakan coba lagi.';
            }
        };

        // Mobile Menu Toggle logic
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });
        }
        if (overlay) {
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }

        renderOnboarding();
    </script>
</body>
</html>
